<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - Jiang 的博客</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">📝 Jiang 的博客</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">首页</a>
            <a href="journal.html" class="nav-link active">博客</a>
            <button class="btn btn-sm" id="loginBtn" style="padding:4px 12px;font-size:13px">🔑 登录</button>
        </div>
        <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
        <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
</nav>

<main>
    <section class="section">
        <div class="section-container">
            <div class="journal-header">
                <h2 class="section-title">📝 博客文章</h2>
                <button class="btn btn-primary" id="newEntryBtn">✏️ 写文章</button>
            </div>

            <div class="journal-toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索文章..." class="search-input">
                </div>
                <div class="filter-group">
                    <select id="categoryFilter" class="select-input">
                        <option value="all">全部分类</option>
                        <option value="学习笔记">📖 学习笔记</option>
                        <option value="灵感碎片">💡 灵感碎片</option>
                        <option value="日常记录">📅 日常记录</option>
                        <option value="收藏整理">🔖 收藏整理</option>
                    </select>
                    <select id="sortFilter" class="select-input">
                        <option value="newest">最新优先</option>
                        <option value="oldest">最早优先</option>
                    </select>
                </div>
            </div>

            <div class="blog-grid" id="entriesGrid">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h3>还没有文章</h3>
                    <p>点击上方按钮开始写第一篇文章吧！</p>
                </div>
            </div>

            <div class="pagination" id="pagination">
                <button class="btn btn-secondary" id="loadMoreBtn">加载更多</button>
            </div>
        </div>
    </section>
</main>

<div class="modal-overlay" id="loginOverlay">
    <div class="modal">
        <div class="modal-header">
            <h3>🔑 验证身份</h3>
            <button class="modal-close" id="loginClose">&times;</button>
        </div>
        <div class="modal-body">
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginPassword">请输入密码以管理文章</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="输入密码..." required>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="loginCancel">取消</button>
            <button class="btn btn-primary" id="loginConfirm">确认</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="detailOverlay">
    <div class="modal modal-detail">
        <div class="modal-header">
            <h3 id="detailTitle">标题</h3>
            <button class="modal-close" id="detailClose">&times;</button>
        </div>
        <div class="modal-body">
            <div class="detail-meta">
                <span class="entry-category" id="detailCategory"></span>
                <span class="entry-date" id="detailDate"></span>
                <span class="reading-time" id="detailReadingTime"></span>
            </div>
            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-content markdown-body" id="detailContent"></div>
        </div>
        <div class="modal-footer">
            <a href="#" class="btn btn-primary btn-sm" id="detailOpenBtn" target="_blank">打开全文</a>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal modal-wide" id="editorModal">
        <div class="modal-header">
            <h3 id="modalTitle">写文章</h3>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body">
            <form id="entryForm">
                <div class="form-group">
                    <label for="entryTitle">标题</label>
                    <input type="text" id="entryTitle" class="form-input" placeholder="给文章起个标题..." required>
                </div>
                <div class="form-group">
                    <label for="entryCategory">分类</label>
                    <select id="entryCategory" class="form-select">
                        <option value="学习笔记">📖 学习笔记</option>
                        <option value="灵感碎片">💡 灵感碎片</option>
                        <option value="日常记录">📅 日常记录</option>
                        <option value="收藏整理">🔖 收藏整理</option>
                    </select>
                </div>
                <div class="form-group">
                    <div class="editor-tabs">
                        <button type="button" class="editor-tab active" data-tab="write">✏️ 编辑</button>
                        <button type="button" class="editor-tab" data-tab="preview">👁️ 预览</button>
                    </div>
                    <div class="editor-container">
                        <textarea id="entryContent" class="form-textarea editor-textarea" placeholder="开始写吧...&#10;&#10;支持 Markdown 语法：&#10;# 标题&#10;**粗体** *斜体*&#10;- 列表&#10;`代码`&#10;![图片描述](图片URL)" rows="16"></textarea>
                        <div class="editor-preview markdown-body" id="editorPreview" style="display:none"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="entryTags">标签（用逗号分隔）</label>
                    <input type="text" id="entryTags" class="form-input" placeholder="例如：JavaScript, 教程, 前端">
                </div>
                <div class="form-group">
                    <label>封面图片</label>
                    <div class="cover-input-group">
                        <input type="text" id="entryCover" class="form-input" placeholder="输入图片 URL 或上传">
                        <button type="button" class="btn btn-secondary btn-sm" id="uploadImageBtn">🖼️ 上传</button>
                        <input type="file" id="imageInput" accept="image/*" style="display:none">
                    </div>
                    <div class="cover-preview" id="coverPreview" style="display:none">
                        <img id="coverPreviewImg" src="" alt="封面预览">
                        <button type="button" class="btn btn-danger btn-sm" id="coverRemoveBtn">移除</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="modalCancel">取消</button>
            <button class="btn btn-primary" id="modalSave">保存</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<footer class="footer">
    <div class="footer-container">
        <p>&copy; 2026 Jiang 的博客 · 用 ❤️ 记录生活</p>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/main.js"></script>
<script src="js/journal.js"></script>
</body>
</html>
